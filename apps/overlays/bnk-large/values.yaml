# "Large cluster" — F5 single-NIC sizing guide, as verified on ROKS by
# roksbnkctl (appendix C): 9 worker nodes (3 per zone) cx2.48x96, 9 TMM pods,
# deploymentSize Tiny. Hub topology: cluster.create: true builds the VPC, the ROKS
# cluster and BNK from this one overlay; deleting the Application (teardown.cluster:
# true) removes them again.
workspace: bnk-large
namespace: bnk-bnk-large
lifecycle: up
topology: hub
sizing:
  profile: large            # → cluster.workers_per_zone=3, worker_flavor=cx2.48x96, bnk.tmm_replicas=9, cneinstance_size=Tiny
runner:
  tag: v1.57.0
  runAsUser: 1000
storage:
  storageClassName: local-path
secrets:
  mode: existing
teardown:
  cluster: true

config:                        # roksbnkctl config.yaml
  ibmcloud:
    region: us-east
    resource_group: default
  prefix: bnk-large
  tf_source:
    type: embedded
  cluster:
    create: true               # build the cluster (hub only)
    name: bnk-large
    openshift_version: "4.21"
    vpc_cidr: 10.254.0.0/16       # must not overlap any VPC on the transit gateway
  resources:
    transit_gateway:
      create: false
      existing: bnkci-testing  # shared gateway, by name or id
  bnk:
    manifest_version: 2.4.0-EA
    far_repo_url: repo.f5.com
    far_auth_file: non-ga-prod-pull-key.tgz
    subscription_jwt_file: subscription.jwt
  cos:
    instance: bnk-supply-chain
    bucket: bnk-artifacts-0b5a00334eaf
    region: us-south

timeouts:
  cluster: 7200
  apply: 9000
  down: 7200
