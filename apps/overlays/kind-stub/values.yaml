# Local verification on kind with the stub runner (hack/stub-runner).
workspace: kindstub
namespace: bnk-kindstub
lifecycle: up
line: "2.4"
runner:
  image: roksbnkctl-stub
  tag: dev
  imagePullPolicy: Never
  runAsUser: 1000
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
cluster:
  create: false
  name: kind-existing-roks
  registryCosName: bnk-registry-cos
registry:
  mode: adopt
  target: generic
preflight:
  doctor: true
storage:
  size: 1Gi
  storageClassName: standard
secrets:
  mode: inline                 # dev only — the stub never talks to IBM Cloud
  inline:
    IBMCLOUD_API_KEY: stub-not-a-real-key
env:
  ROKSBNKCTL_REGION: us-south
  ROKSBNKCTL_RESOURCE_GROUP: default
  ROKSBNKCTL_PREFIX: kindstub
  ROKSBNKCTL_MANIFEST_VERSION: 2.4.1-0.0.1
  ROKSBNKCTL_LICENSE_MODE: subscription
  STUB_APPLY_SECONDS: "20"
  STUB_DOWN_SECONDS: "8"
  STUB_MIRROR_MISSING: "0"
timeouts:
  init: 120
  cluster: 300
  preflight: 120
  apply: 600
  status: 90
  down: 300
