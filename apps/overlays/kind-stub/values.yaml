# Local verification on kind with the stub runner (hack/stub-runner) — config style.
workspace: kindstub
namespace: bnk-kindstub
lifecycle: up
sizing:
  profile: small
runner:
  image: roksbnkctl-stub
  tag: dev
  imagePullPolicy: Never
  runAsUser: 1000
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
preflight:
  doctor: true
storage:
  size: 1Gi
  storageClassName: standard
secrets:
  mode: inline                 # dev only — the stub never talks to IBM Cloud
  inline:
    IBMCLOUD_API_KEY: stub-not-a-real-key
config:
  ibmcloud:
    region: us-south
    resource_group: default
  prefix: kindstub
  tf_source:
    type: embedded
  cluster:
    create: false
    name: kind-existing-roks
  bnk:
    manifest_version: 2.4.0-0.0.1
    license_mode: subscription
env:                           # stub knobs only
  STUB_APPLY_SECONDS: "20"
  STUB_DOWN_SECONDS: "8"
timeouts:
  init: 120
  cluster: 300
  preflight: 120
  apply: 600
  status: 90
  down: 300
