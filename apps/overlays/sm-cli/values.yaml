# sm-cli — existing ROKS 4.21 cluster in us-east (6× bx2.8x32, 2 per zone,
# public + private service endpoints), driven from the us-south Argo CD hub VSI.
# BNK 2.4 "Small cluster" profile (F5 single-NIC sizing guide): deploymentSize
# stays Tiny on ROKS; capacity is tmmReplicas + node size.
#
# The workspace is described with roksbnkctl's own config.yaml (config:) — the
# same schema the roksbnkctl book documents. Secrets come from bnk-secrets.
workspace: sm-cli
namespace: bnk-sm-cli
lifecycle: up
topology: hub
sizing:
  profile: small               # → cluster.workers_per_zone=2, worker_flavor=bx2.8x32, bnk.tmm_replicas=3, cneinstance_size=Tiny
runner:
  tag: v1.58.0
  runAsUser: 1000              # k3s, not OpenShift — pin the runner's uid
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 3Gi}
storage:
  size: 8Gi
  storageClassName: local-path # k3s default on the hub VSI
secrets:
  mode: existing               # bnk-secrets created by hack/vsi/apply-hub.sh

config:                        # roksbnkctl config.yaml (see `roksbnkctl init example`)
  ibmcloud:
    region: us-east
    resource_group: default
  prefix: sm-cli
  tf_source:
    type: embedded
  cluster:
    create: false              # attach to the existing cluster (cluster register)
    name: sm-cli
    openshift_version: "4.21"
    network_mode: single-nic
  resources:
    transit_gateway:
      create: false
      existing: sm-cli-tgw     # the gateway the cluster VPC is already on
  bnk:
    manifest_version: 2.4.0-EA
    far_repo_url: repo.f5.com
    far_auth_file: non-ga-prod-pull-key.tgz
    subscription_jwt_file: subscription.jwt
  cos:
    instance: bnk-supply-chain
    bucket: bnk-artifacts-0b5a00334eaf
    region: us-south

timeouts:
  init: 600
  cluster: 1800
  preflight: 900
  apply: 7200
  status: 300
  down: 5400
