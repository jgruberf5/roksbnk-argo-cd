# "Medium cluster" — F5 single-NIC sizing guide, as verified on ROKS by
# roksbnkctl (appendix C): 6 worker nodes (2 per zone) cx2.16x32, 3 TMM pods,
# deploymentSize Tiny. Hub topology: cluster.create: true builds the VPC, the ROKS
# cluster and BNK from this one overlay; deleting the Application (teardown.cluster:
# true) removes them again.
workspace: bnk-medium
namespace: bnk-bnk-medium
lifecycle: up
topology: hub
line: "2.4"
sizing:
  profile: medium            # → cluster.workers_per_zone=2, worker_flavor=cx2.16x32, bnk.tmm_replicas=3, cneinstance_size=Tiny
runner:
  tag: v1.54.0
  runAsUser: 1000
registry:
  mode: none
storage:
  storageClassName: local-path
secrets:
  mode: existing
teardown:
  cluster: true

config:                        # roksbnkctl config.yaml
  ibmcloud:
    region: us-east
    resource_group: default
  prefix: bnk-medium
  tf_source:
    type: embedded
  cluster:
    create: true               # build the cluster (hub only)
    name: bnk-medium
    openshift_version: "4.21"
    vpc_cidr: 10.253.0.0/16       # must not overlap any VPC on the transit gateway
  resources:
    transit_gateway:
      create: false
      existing: bnkci-testing  # shared gateway, by name or id
  bnk:
    manifest_version: 2.4.0-EA
    far_repo_url: repo.f5.com
    far_auth_file: non-ga-prod-pull-key.tgz
    subscription_jwt_file: subscription.jwt
  cos:
    instance: bnk-supply-chain
    bucket: bnk-artifacts-0b5a00334eaf
    region: us-south

timeouts:
  cluster: 7200
  apply: 7200
  down: 7200
