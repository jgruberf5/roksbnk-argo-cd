# Connected ROKS cluster, in-target topology (OpenShift GitOps on the cluster
# itself). An existing cluster is registered, BNK pulls straight from FAR, the
# subscription licence comes from the COS bucket. Small profile.
workspace: bnkconn
namespace: bnk-bnkconn
lifecycle: up
topology: in-target
sizing:
  profile: small
runner:
  tag: v1.58.0                      # leave runAsUser unset on OpenShift (SCC assigns it)
storage:
  storageClassName: ibmc-vpc-block-10iops-tier
secrets:
  mode: externalSecret              # IBMCLOUD_API_KEY from IBM Secrets Manager
  externalSecret:
    storeRef: {name: ibm-secrets-manager, kind: ClusterSecretStore}
    data:
      - key: IBMCLOUD_API_KEY
        remoteRef: {key: bnk-ibmcloud-api-key}

config:                             # roksbnkctl config.yaml
  ibmcloud:
    region: us-south
    resource_group: default
  prefix: bnkconn
  tf_source:
    type: embedded
  cluster:
    create: false
    name: my-existing-roks
    openshift_version: "4.21"
    network_mode: single-nic
  bnk:
    manifest_version: 2.4.0-EA
    far_repo_url: repo.f5.com
    far_auth_file: f5-far-auth-key.tgz
    subscription_jwt_file: subscription.jwt
  cos:
    instance: bnk-supply-chain
    bucket: bnk-supply-chain
    region: us-south
