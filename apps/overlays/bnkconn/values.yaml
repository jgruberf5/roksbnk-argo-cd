# Connected ROKS cluster, in-target topology (OpenShift GitOps on the cluster
# itself). Mirrors wf-existing-cluster.yaml from the Argo Workflows demos: an
# existing cluster is registered, BNK pulls straight from FAR (no mirror), the
# JWT subscription licence comes from the COS bucket.
workspace: bnkconn
namespace: bnk-bnkconn
lifecycle: up
topology: in-target
line: "2.4"
runner:
  tag: v1.54.0
cluster:
  create: false
  name: my-existing-roks            # ROKSBNKCTL_CLUSTER_NAME
  registryCosName: bnk-registry-cos # COS instance holding the registry bucket
registry:
  mode: none
storage:
  storageClassName: ibmc-vpc-block-10iops-tier
secrets:
  mode: externalSecret              # IBMCLOUD_API_KEY (+ BIGIP/GTM passwords) from IBM Secrets Manager
  externalSecret:
    storeRef: {name: ibm-secrets-manager, kind: ClusterSecretStore}
    data:
      - key: IBMCLOUD_API_KEY
        remoteRef: {key: bnk-ibmcloud-api-key}
env:
  ROKSBNKCTL_REGION: us-south
  ROKSBNKCTL_RESOURCE_GROUP: default
  ROKSBNKCTL_PREFIX: bnkconn
  ROKSBNKCTL_MANIFEST_VERSION: 2.4.0-0.0.1
  ROKSBNKCTL_COS_INSTANCE: bnk-supply-chain-cos
  ROKSBNKCTL_COS_BUCKET: bnk-supply-chain
  ROKSBNKCTL_COS_REGION: us-south
  ROKSBNKCTL_FAR_AUTH_FILE: f5-far-auth-key.tgz
  ROKSBNKCTL_SUBSCRIPTION_JWT_FILE: subscription.jwt
  ROKSBNKCTL_LICENSE_MODE: subscription
  ROKSBNKCTL_CLUSTER_NETWORK_MODE: public
  # blank on purpose: bnk-env is per-workspace here, but keep the connected
  # semantics explicit — no mirror, render every image against far_repo_url
  ROKSBNKCTL_GENERIC_HOST: ""
