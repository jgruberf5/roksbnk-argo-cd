# Disconnected ROKS cluster via the hub topology (Argo CD on the services-VPC
# management cluster; the runner reaches Harbor's private IP and the ROKS API
# over the Transit Gateway). Mirrors wf-existing-disconnected.yaml: the Harbor
# mirror was populated by a separate `registry replicate` run, this workspace
# adopts it; licensing goes through the F5 License Proxy handed off in a Secret.
workspace: bnkdisco
namespace: bnk-bnkdisco
lifecycle: up
topology: hub
line: "2.4"
runner:
  image: 10.240.0.4/bnk-mirror/roksbnkctl-tools-runner   # mirrored runner (air-gapped pull)
  tag: v1.54.0
  extraEnvFrom:
    - secretRef: {name: flp-handoff}   # ROKSBNKCTL_FLP_EXTERNAL_URL + ROKSBNKCTL_FLP_ROOT_CA_B64
cluster:
  create: false
  name: bnk-cid
  registryCosName: bnk-registry-cos
registry:
  mode: adopt
  target: generic
storage:
  storageClassName: local-path        # k3s hub; use ibmc-vpc-block-* on a ROKS hub
secrets:
  mode: existing                      # bnk-secrets created out of band on the hub
flpHandoff:
  writeSecret: true                   # an `flp up` workspace on the same hub writes flp-handoff
env:
  ROKSBNKCTL_REGION: us-south
  ROKSBNKCTL_RESOURCE_GROUP: default
  ROKSBNKCTL_PREFIX: bnk-cid
  ROKSBNKCTL_MANIFEST_VERSION: 2.4.0-0.0.1
  ROKSBNKCTL_COS_INSTANCE: bnk-supply-chain-cos
  ROKSBNKCTL_COS_BUCKET: bnk-supply-chain
  ROKSBNKCTL_COS_REGION: us-south
  ROKSBNKCTL_FAR_AUTH_FILE: f5-far-auth-key.tgz
  ROKSBNKCTL_SUBSCRIPTION_JWT_FILE: subscription.jwt
  ROKSBNKCTL_LICENSE_MODE: f5licenseproxy
  ROKSBNKCTL_CLUSTER_NETWORK_MODE: private
  ROKSBNKCTL_TRANSIT_GATEWAY_NAME: bnkci-testing
  ROKSBNKCTL_CLUSTER_VPC_CIDR: 10.247.0.0/16
  ROKSBNKCTL_GENERIC_HOST: 10.240.0.4
  ROKSBNKCTL_GENERIC_REPO_PREFIX: bnk-mirror
  ROKSBNKCTL_GENERIC_USERNAME: admin
