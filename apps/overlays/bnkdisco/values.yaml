# Disconnected ROKS cluster via the hub topology (Argo CD on the services-VPC
# management cluster; the runner reaches Harbor's private IP and the ROKS API
# over the Transit Gateway). The Harbor mirror was populated by a separate
# `registry replicate` run and is adopted here; licensing goes through the F5
# License Proxy whose endpoint and root CA arrive in the flp-handoff Secret.
workspace: bnkdisco
namespace: bnk-bnkdisco
lifecycle: up
topology: hub
line: "2.4"
sizing:
  profile: small
runner:
  image: 10.240.0.4/bnk-mirror/roksbnkctl-tools-runner   # mirrored runner (air-gapped pull)
  tag: v1.54.0
  runAsUser: 1000
  extraEnvFrom:
    - secretRef: {name: flp-handoff}   # F5 License Proxy endpoint + root CA, written by the flp workspace
cluster:
  registryCosName: bnk-registry-cos
registry:
  mode: adopt                       # the mirror exists; record it (registry adopt)
  target: generic
storage:
  storageClassName: local-path      # k3s hub; ibmc-vpc-block-* on a ROKS hub
secrets:
  mode: existing                    # bnk-secrets (IBMCLOUD_API_KEY, ROKSBNKCTL_GENERIC_PASSWORD) created out of band
flpHandoff:
  writeSecret: true

config:                             # roksbnkctl config.yaml
  ibmcloud:
    region: us-east
    resource_group: default
  prefix: bnk-cid
  tf_source:
    type: embedded
  cluster:
    create: false
    name: bnk-cid
    openshift_version: "4.21"
    network_mode: single-nic
    vpc_cidr: 10.247.0.0/16
  resources:
    transit_gateway:
      create: false
      existing: bnkci-testing
  bnk:
    manifest_version: 2.4.0-EA
    far_auth_file: f5-far-auth-key.tgz
    subscription_jwt_file: subscription.jwt
    license_mode: f5licenseproxy
  cos:
    instance: bnk-supply-chain
    bucket: bnk-supply-chain
    region: us-south
  registry:
    target: generic
    generic_host: 10.240.0.4
    generic_repo_prefix: bnk-mirror
    generic_username: admin
