# One Application per workspace overlay. Each element names the overlay under
# apps/overlays/<workspace>/values.yaml and the destination cluster:
#   in-target: the ROKS cluster hosting OpenShift GitOps (https://kubernetes.default.svc)
#   hub:       the hub itself for the driver Jobs (roksbnkctl reaches ROKS over the TGW)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bnk-workspaces
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - workspace: bnkconn
            server: https://kubernetes.default.svc
          - workspace: bnkdisco
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: "bnk-{{ .workspace }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bnk
      sources:
        - repoURL: https://github.com/<org>/roksbnk-argo-cd.git
          targetRevision: main
          path: charts/bnk-workspace
          helm:
            releaseName: "bnk-{{ .workspace }}"
            valueFiles:
              - "$values/apps/overlays/{{ .workspace }}/values.yaml"
        - repoURL: https://github.com/<org>/roksbnk-argo-cd.git
          targetRevision: main
          ref: values
      destination:
        server: "{{ .server }}"
        namespace: "bnk-{{ .workspace }}"
      ignoreDifferences:
        - kind: ConfigMap
          name: bnk-status
          jsonPointers: ["/data"]
      syncPolicy:
        # manual sync by design — see AppProject role bnk-operator
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
        retry:
          limit: 0
