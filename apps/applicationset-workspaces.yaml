# One Application per overlay, derived from the overlay itself: the git-files
# generator reads every apps/overlays/*/values.yaml and exposes its keys to the
# template, so the workspace name, namespace, cluster, BNK version and size are
# written exactly once — in the overlay.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bnk-workspaces
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:jgruberf5/roksbnk-argo-cd.git
        revision: main
        files:
          - path: "apps/overlays/*/values.yaml"
          - path: "apps/overlays/kind-stub/values.yaml"
            exclude: true                       # local verification only
  template:
    metadata:
      name: "bnk-{{ .workspace }}"
      labels:
        roksbnkctl.io/bnk-version: "{{ .config.bnk.manifest_version }}"
        roksbnkctl.io/line: '{{ regexFind "^[0-9]+\\.[0-9]+" .config.bnk.manifest_version }}'
        roksbnkctl.io/sizing-profile: "{{ .sizing.profile }}"
        roksbnkctl.io/cluster: "{{ .config.cluster.name }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bnk
      sources:
        - repoURL: git@github.com:jgruberf5/roksbnk-argo-cd.git
          targetRevision: main
          path: charts/bnk-workspace
          helm:
            releaseName: "bnk-{{ .workspace }}"
            valueFiles:
              - "$values/{{ .path.path }}/values.yaml"
        - repoURL: git@github.com:jgruberf5/roksbnk-argo-cd.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc   # the cluster Argo CD runs in (in-target or hub)
        namespace: "{{ .namespace }}"
      ignoreDifferences:
        - kind: ConfigMap
          name: bnk-status
          jsonPointers: ["/data"]
      syncPolicy:
        # manual sync by design — see AppProject role bnk-operator
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
        retry:
          limit: 0
