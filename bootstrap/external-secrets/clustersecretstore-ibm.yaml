# External Secrets Operator: materialise bnk-secrets from IBM Cloud Secrets
# Manager. The ESO auth API key (read-only on the Secrets Manager instance) is
# the only secret created by hand; every workspace secret is then declared as
# an ExternalSecret by the chart (secrets.mode: externalSecret).
#
#   kubectl -n external-secrets create secret generic ibm-sm-auth --from-literal=apiKey=...
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ibm-secrets-manager
spec:
  provider:
    ibm:
      serviceUrl: https://<instance-id>.<region>.secrets-manager.appdomain.cloud
      auth:
        secretRef:
          secretApiKeySecretRef:
            name: ibm-sm-auth
            key: apiKey
            namespace: external-secrets
