# Serves the bare repositories mounted at /repo on the kind node over git's
# smart HTTP protocol (hack/kind/git-http wraps `git http-backend`). Argo CD
# fetches http://git.git.svc:8080/roksbnk-argo-cd.git — publish with
# hack/kind/publish.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: git
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitserver
  namespace: git
spec:
  replicas: 1
  selector:
    matchLabels: {app: gitserver}
  template:
    metadata:
      labels: {app: gitserver}
    spec:
      containers:
        - name: http
          image: git-http:dev
          imagePullPolicy: Never
          env: [{name: GIT_PROJECT_ROOT, value: /repo}]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: repo, mountPath: /repo, readOnly: true}]
      volumes:
        - name: repo
          hostPath: {path: /repo, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: git
  namespace: git
spec:
  selector: {app: gitserver}
  ports: [{port: 8080, targetPort: 8080}]
