# bnk-workspace — one roksbnkctl workspace driven by Argo CD.
# Overlays under apps/overlays/<workspace>/values.yaml override these.

workspace: bnk                 # roksbnkctl workspace name (-w)
namespace: bnk-ci              # namespace the hook Jobs run in (Argo CD destination)
createNamespace: false         # true renders a Namespace (else rely on CreateNamespace=true)

# up   → Sync hook runs `bnk up --auto`
# down → Sync hook runs `bnk down --auto` (teardown while keeping the Application;
#        also the only teardown path on Argo CD < 3.3, which has no PreDelete hook)
lifecycle: up

# in-target: Argo CD lives on the ROKS cluster that receives BNK (OpenShift GitOps)
# hub:       Argo CD on a management cluster; roksbnkctl reaches ROKS over the TGW
topology: in-target

line: ""                       # BNK line; blank = derived from config.bnk.manifest_version (2.3 enables the cwc-guard container)

# ---------------------------------------------------------------------------
# SIZING — read this before anything else.
#
# F5's single-NIC sizing guide names three CLUSTER sizes. They are node count,
# node flavour and TMM pod count — NOT the BNK `deploymentSize`. On ROKS the
# CNEInstance deploymentSize is ALWAYS `Tiny` for the 2.4 line: every larger
# profile requests hugepages that ROKS workers cannot provide, and the install
# fails silently. Capacity comes from tmmReplicas and node size.
#
#   profile   workers/zone  flavour     TMM pods  L4 ingress (F5 figure)
#   baseline  1 (3 nodes)   bx2.16x64   1         the BNK 2.4 install-guide shape
#   small     2 (6 nodes)   bx2.8x32    3         ~7.8 Gbit/s
#   medium    2 (6 nodes)   cx2.16x32   3         ~10.4 Gbit/s
#   large     3 (9 nodes)   cx2.48x96   9         ~31 Gbit/s
#
# A profile sets ROKSBNKCTL_WORKERS_PER_ZONE / ROKSBNKCTL_WORKER_FLAVOR /
# ROKSBNKCTL_TMM_REPLICAS (and ROKSBNKCTL_CNEINSTANCE_SIZE=Tiny) in bnk-env;
# anything you put under `env:` still wins. With `cluster.create: false` the
# node keys describe the cluster you register; only TMM_REPLICAS is applied.
# `custom` sets nothing — you supply the env keys yourself.
# ---------------------------------------------------------------------------
sizing:
  profile: custom              # baseline | small | medium | large | custom
  deploymentSize: Tiny         # do not change on ROKS (see above)
  allowNonTinyDeploymentSize: false   # the chart refuses any other value on line 2.4 unless this is true

runner:
  image: ghcr.io/jgruberf5/roksbnkctl-tools-runner
  tag: v1.54.0
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  env: {}                      # extra plain env on the runner containers
  extraEnvFrom: []             # e.g. [{secretRef: {name: flp-handoff}}]
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  fsGroup: 0                   # runner is uid 1000 / gid 0 (OpenShift arbitrary-uid safe)
  runAsUser: null              # leave unset on OpenShift (SCC assigns), set 1000 elsewhere
  nodeSelector: {}
  tolerations: []

cluster:                       # (config mode reads create/name from config.cluster; these are the env-mode fields)
  create: false
  name: ""
  registryCosName: ""          # only if the registry COS instance is not named <prefix>-registry-cos

registry:
  mode: ""                     # blank = adopt when config.registry names a mirror, else none;
                               # adopt (mirror populated elsewhere) | replicate (pod can reach FAR) | none
  target: generic              # icr | generic (replicate only)

# ---------------------------------------------------------------------------
# UPGRADES. BNK 2.3 and 2.4 do not support in-place upgrades: the supported path
# is `bnk down` (uninstall the old version) followed by `bnk up` (install the
# new). When ROKSBNKCTL_MANIFEST_VERSION differs from the version recorded in
# the applied workspace, the bnk-up hook therefore never applies the change in
# place:
#   down-then-up  run `bnk down --auto`, then `bnk up --auto`, in the same sync
#                 (Sync is the approval; the preflight log announces it)
#   refuse        fail the preflight gate with instructions to set
#                 lifecycle: down, sync, change the version, set up, sync
# ---------------------------------------------------------------------------
upgrade:
  strategy: down-then-up       # down-then-up | refuse

preflight:
  doctor: true                 # run `roksbnkctl doctor` in the init hook
  command: ""                  # e.g. `roksbnkctl -w "$WS" bnk preflight` once that verb exists;
                               # empty = shell replica of the workspace-file guards

cwcGuard:
  enabled: auto                # auto | true | false — the f5-spk-cwc Multi-Attach workaround (BNK 2.3)
  # Adapted from scripts/demos/blueprint-workflows-ci-demo/workflows/wf-existing-cluster.yaml.
  # Runs as a second container in the bnk-up Job; exits when /signal/done appears
  # (bnk up returned), when the licence goes Active, or after ~27 minutes.
  script: |
    NS="${CWC_NAMESPACE:-${ROKSBNKCTL_FLO_UTILS_NAMESPACE:-f5-utils}}"; DEP="${CWC_DEPLOYMENT:-f5-spk-cwc}"
    K="roksbnkctl -w $WS kubectl"
    patched=0
    for _ in $(seq 1 160); do
      [ -f /signal/done ] && { echo "cwc: bnk up finished — guard done"; exit 0; }
      if $K -n "$NS" get deploy "$DEP" >/dev/null 2>&1; then
        if [ "$patched" = 0 ]; then
          $K -n "$NS" patch deploy "$DEP" --type=merge \
            -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}' >/dev/null 2>&1 \
            && { patched=1; echo "cwc: strategy=Recreate applied"; }
        fi
        pods="$($K -n "$NS" get pods 2>/dev/null | grep "$DEP" || true)"
        if [ "$(echo "$pods" | grep -c "$DEP")" -gt 1 ] && echo "$pods" | grep -q ContainerCreating; then
          echo "cwc: Multi-Attach deadlock — cycling replicas to release the RWO volume"
          $K -n "$NS" scale deploy "$DEP" --replicas=0 >/dev/null 2>&1
          for _ in $(seq 1 20); do
            [ "$($K -n "$NS" get pods 2>/dev/null | grep -c "$DEP")" = 0 ] && break
            sleep 6
          done
          $K -n "$NS" scale deploy "$DEP" --replicas=1 >/dev/null 2>&1
        fi
        if [ "$($K -n "$NS" get licenses.k8s.f5net.com bnk-license -o jsonpath='{.status.state}' 2>/dev/null)" = "Active" ]; then
          echo "cwc: licence Active — guard done"; exit 0
        fi
      fi
      sleep 10
    done
    exit 0

storage:
  claimName: bnk-work
  size: 8Gi
  accessMode: ReadWriteOnce
  storageClassName: ""         # ROKS: ibmc-vpc-block-10iops-tier; kind: standard

serviceAccount:
  name: bnk-runner
  annotations: {}

# ---------------------------------------------------------------------------
# DESCRIBING THE WORKSPACE — two styles, pick one per overlay.
#
# config:  roksbnkctl's native config.yaml, verbatim (the schema `roksbnkctl init
#          example` prints). The chart renders it into the bnk-config ConfigMap,
#          mounts it at /config, and the init hook runs
#            roksbnkctl init -w <ws> --config-file /config/config.yaml --override-from-env
#          Preferred: it is the same file the roksbnkctl book documents, it diffs
#          cleanly in the Argo CD UI, and it can carry blocks env cannot (state:
#          for the COS remote backend, bnk.network.zones, gateway:, …).
#          The sizing profile merges into cluster.workers_per_zone /
#          cluster.worker_flavor / bnk.tmm_replicas / bnk.cneinstance_size.
#          NEVER put secrets in it: the API key and passwords come from
#          bnk-secrets through the environment, which init applies on top.
#
# env:     ROKSBNKCTL_* keys → the bnk-env ConfigMap; init runs
#            roksbnkctl init -w <ws> --non-interactive --override-from-env
#          Kept for CI-style setups that already speak ROKSBNKCTL_*.
#
# With config: set, env: is still applied (secrets, STUB_* knobs, one-off
# overrides) but the chart only derives ROKSBNKCTL_CLUSTER_CREATE / _CLUSTER_NAME /
# _MANIFEST_VERSION / REGISTRY_COS_NAME / _REGISTRY_TARGET from it for the hooks.
# ---------------------------------------------------------------------------
config: {}
#  ibmcloud: {region: us-east, resource_group: default}
#  prefix: my-ws
#  tf_source: {type: embedded}
#  cluster: {create: false, name: my-roks, openshift_version: "4.21", network_mode: single-nic}
#  resources: {transit_gateway: {create: false, existing: my-tgw}}
#  bnk: {manifest_version: 2.4.0-EA, far_auth_file: f5-far-auth-key.tgz, subscription_jwt_file: subscription.jwt}
#  cos: {instance: bnk-supply-chain, bucket: my-bucket, region: us-south}
workspaceConfig:
  configMapName: bnk-config
  mountPath: /config

env:
  configMapName: bnk-env
  # ROKSBNKCTL_REGION: us-south
  # ROKSBNKCTL_RESOURCE_GROUP: default
  # ROKSBNKCTL_PREFIX: bnk
  # ROKSBNKCTL_MANIFEST_VERSION: 2.4.0-...
  # ROKSBNKCTL_COS_INSTANCE / ROKSBNKCTL_COS_BUCKET / ROKSBNKCTL_COS_REGION
  # ROKSBNKCTL_FAR_AUTH_FILE / ROKSBNKCTL_SUBSCRIPTION_JWT_FILE
  # ROKSBNKCTL_LICENSE_MODE: f5licenseproxy

secrets:
  mode: existing               # existing | externalSecret | inline (dev only) | none
  name: bnk-secrets            # IBMCLOUD_API_KEY, ROKSBNKCTL_GENERIC_PASSWORD, ROKSBNKCTL_BIGIP_PASSWORD, ...
  externalSecret:
    refreshInterval: 1h
    storeRef: {name: ibm-secrets-manager, kind: ClusterSecretStore}
    data: []
    # - key: IBMCLOUD_API_KEY
    #   remoteRef: {key: bnk-ibmcloud-api-key}
  inline: {}

flpHandoff:
  writeSecret: false           # grant the runner create/patch on the FLP hand-off Secret
  secretName: flp-handoff

status:
  configMapName: bnk-status

hooks:
  deletePolicy: BeforeHookCreation   # keep the last run's Jobs (incl. failed) until the next sync

preDelete:
  enabled: true                # Argo CD >= 3.3: deleting the Application runs bnk down first

# F5 License Proxy deployed by THIS workspace (config.bnk.flp: mode vsi or helm) —
# `flp up --auto` runs before bnk up and its hand-off (flp-outputs.json) is picked
# up by bnk up automatically when config.bnk.license_mode is f5licenseproxy.
flp:
  deploy: false

teardown:
  cluster: false               # with cluster.create=true (hub): also tgw disconnect + cluster down on delete
  flp: true                    # with flp.deploy=true: flp down after bnk down on delete / lifecycle down

timeouts:                      # activeDeadlineSeconds per hook Job
  init: 600
  cluster: 7200
  registry: 7200
  flp: 3600
  preflight: 900
  apply: 7200
  status: 300
  down: 5400
