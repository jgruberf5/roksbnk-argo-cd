{{- /*
secrets.mode:
  existing        the Secret is created out of band (kubectl, a vault agent, …)
  externalSecret  render an ExternalSecret (External Secrets Operator) that
                  materialises the Secret from IBM Secrets Manager / Vault
  inline          DEV ONLY — plain Secret from values (never commit real keys)
  none            no secretRef on the runner (stub/testing)
*/ -}}
{{- if eq .Values.secrets.mode "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bnk.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.secrets.externalSecret.storeRef | nindent 4 }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.externalSecret.data }}
    - secretKey: {{ .key }}
      remoteRef:
        {{- toYaml .remoteRef | nindent 8 }}
    {{- end }}
{{- else if eq .Values.secrets.mode "inline" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bnk.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.inline }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
{{- end }}
