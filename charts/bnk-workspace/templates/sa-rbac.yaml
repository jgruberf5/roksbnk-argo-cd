# The runner's identity in the cluster Argo CD deploys into. It is deliberately
# narrow: roksbnkctl reaches IBM Cloud and the ROKS API with the IBM API key
# (never this ServiceAccount); the SA only needs to write the status ConfigMap
# and, optionally, the FLP hand-off Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bnk.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bnk.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, patch, update]
  - apiGroups: [batch]            # SyncFail names the failed hook Jobs
    resources: [jobs]
    verbs: [get, list]
  {{- if .Values.flpHandoff.writeSecret }}
  # create cannot be pinned to a resourceName; get/update/patch are.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.flpHandoff.secretName }}]
    verbs: [get, update, patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bnk.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.serviceAccount.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
