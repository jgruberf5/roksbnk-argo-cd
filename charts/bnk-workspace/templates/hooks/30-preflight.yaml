{{- if eq .Values.lifecycle "up" }}
{{- $script := "" }}
{{- if .Values.preflight.command }}
{{- $script = printf `
# preflight.command is set — delegate to roksbnkctl (e.g. a future
# bnk preflight verb that runs prepareBNKUp through terraform plan).
fail() { write_status failed "$(deployed_now)" "preflight: $*"; echo "preflight: $*" >&2; exit 1; }
%s || fail "roksbnkctl preflight command failed"
` .Values.preflight.command }}
{{- else }}
{{- $script = printf `
# Shell replica of the workspace-file guards prepareBNKUp runs before
# terraform plan (internal/orchestration/lifecycle.go). bnk up re-runs all of
# them itself; this gate exists so a misconfiguration fails the sync in seconds
# instead of minutes into the apply. NOTE: 'roksbnkctl plan' is the legacy
# composite path (writeAndInit, no bnk-phase override) and is not usable here.
HOME_WS="${ROKSBNKCTL_HOME:-/work/.roksbnkctl}/$WS"
fail() { write_status failed "$(deployed_now)" "preflight: $*"; echo "preflight: $*" >&2; exit 1; }

[ -f "$HOME_WS/config.yaml" ] || fail "workspace $WS not initialised (bnk-init hook did not run?)"
[ -f "$HOME_WS/cluster-outputs.json" ] || fail "cluster-outputs.json missing — cluster register / cluster up did not complete"

# guardRegistryMirror
if [ -n "${ROKSBNKCTL_REGISTRY_TARGET:-$(cfg_get registry target)}" ]; then
  rec="$HOME_WS/registry-mirror.json"
  [ -f "$rec" ] || fail "a registry mirror is configured (ROKSBNKCTL_REGISTRY_TARGET=$ROKSBNKCTL_REGISTRY_TARGET) but there is no record of it — run registry replicate or registry adopt"
  [ "$(jq -r '.chart_host // ""' "$rec")" != "" ] && [ "$(jq -r '.image_host // ""' "$rec")" != "" ] || fail "registry-mirror.json is incomplete (chart_host/image_host)"
  missing=$(jq -r '.missing_count // 0' "$rec")
  [ "$missing" = "0" ] || fail "registry mirror incomplete: $missing artifacts missing (registry verify)"
fi

# FLP hand-off is mandatory in f5licenseproxy mode (bnk-flp-override.tfvars)
if [ "${ROKSBNKCTL_LICENSE_MODE:-$(cfg_get bnk license_mode)}" = "f5licenseproxy" ]; then
  # the hand-off is one of: config.bnk.flp.external (url + root_ca_b64), the env pair, or flp-outputs.json from flp up
  ext=$(awk '/^bnk:/{b=1;next} b&&/^[^ ]/{b=0} b&&/^ +external:/{e=1;next} e&&/^ +url: *[^ ]/{print "yes";exit}' "$CFG" 2>/dev/null)
  if [ "$ext" != "yes" ] && { [ -z "${ROKSBNKCTL_FLP_EXTERNAL_URL:-}" ] || [ -z "${ROKSBNKCTL_FLP_ROOT_CA_B64:-}" ]; }; then
    [ -f "$HOME_WS/flp-outputs.json" ] || fail "license_mode=f5licenseproxy but no FLP hand-off: set config.bnk.flp.external (url + root_ca_b64) or run flp up first"
  fi
  echo "preflight: FLP hand-off present ($( [ "$ext" = yes ] && echo config.bnk.flp.external || echo flp-outputs.json ))"
fi

# guardCreateTimeSettings: a 2.3 <-> 2.4 line flip against an applied workspace is refused
applied="$HOME_WS/state/terraform.applied.tfvars"
desired_version="${ROKSBNKCTL_MANIFEST_VERSION:-$(cfg_get bnk manifest_version)}"
if [ -f "$applied" ] && [ -n "$desired_version" ]; then
  want=$(printf '%%s' "$desired_version" | cut -d. -f1-2)
  have=$(sed -n 's/^ *bnk_line *= *"\([^"]*\)".*/\1/p' "$applied" | head -1)
  if [ -n "$have" ] && [ "$have" != "$want" ]; then
    fail "BNK line change $have -> $want is refused on an applied workspace (bnk down first)"
  fi
fi

# BNK does not support in-place upgrades (2.3 and 2.4): a manifest-version change
# on an applied workspace is either refused here or turned into down-then-up by bnk-up.
vc=$(version_change)
if [ -n "$vc" ]; then
  set -- $vc
  case "%s" in
    refuse) fail "BNK version change $1 -> $2 on an applied workspace: BNK does not support in-place upgrades. Set lifecycle: down and sync, change the version, set lifecycle: up and sync (upgrade.strategy=refuse)" ;;
    down-then-up) echo "preflight: BNK version change $1 -> $2 — no in-place upgrade exists; bnk-up will run bnk down, then bnk up (upgrade.strategy=down-then-up)" ;;
    *) fail "upgrade.strategy must be down-then-up or refuse" ;;
  esac
fi
roksbnkctl -w "$WS" bnk status --json > /tmp/status.json || echo '{}' > /tmp/status.json
echo "preflight: ok (deployed=$(deployed_now))"
` .Values.upgrade.strategy }}
{{- end }}
{{ include "bnk.hookJob" (dict "root" . "name" "bnk-preflight" "hook" "Sync" "wave" "-1" "deadline" .Values.timeouts.preflight "script" $script "cwc" false) }}
{{- end }}
