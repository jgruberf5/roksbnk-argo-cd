{{- if and (eq .Values.lifecycle "up") .Values.flp.deploy }}
{{- $script := `
# F5 License Proxy for this workspace (config.bnk.flp). Runs before the
# registry gate and bnk up; writes flp-outputs.json (endpoint + root CA), which
# bnk up turns into the licence-proxy hand-off on its own.
roksbnkctl -w "$WS" flp up --auto
roksbnkctl -w "$WS" flp status || true
` -}}
{{ include "bnk.hookJob" (dict "root" . "name" "bnk-flp" "hook" "Sync" "wave" "-3" "deadline" .Values.timeouts.flp "script" $script "cwc" false) }}
{{- end }}
