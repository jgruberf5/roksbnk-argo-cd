{{- if eq .Values.lifecycle "up" }}
{{- $cmd := "" }}
{{- if eq (include "bnk.clusterCreate" .) "true" }}
{{- $cmd = `roksbnkctl -w "$WS" cluster up --auto` }}
{{- else }}
{{- $cmd = printf `CLUSTER_NAME="${ROKSBNKCTL_CLUSTER_NAME:-$(cfg_get cluster name)}"
[ -n "$CLUSTER_NAME" ] || { echo "config.cluster.name is required to register an existing cluster" >&2; exit 1; }
roksbnkctl -w "$WS" cluster register "$CLUSTER_NAME" %s` (ternary (printf `--registry-cos-name %q` .Values.cluster.registryCosName) "" (ne .Values.cluster.registryCosName "")) }}
{{- end }}
{{- $script := printf `
%s
roksbnkctl -w "$WS" kubeconfig --download
` $cmd -}}
{{ include "bnk.hookJob" (dict "root" . "name" "bnk-cluster" "hook" "Sync" "wave" "-3" "deadline" .Values.timeouts.cluster "script" $script "cwc" false) }}
{{- end }}
